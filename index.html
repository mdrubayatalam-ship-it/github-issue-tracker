<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Github Issue Tracker</title>
    <link
      rel="shortcut icon"
      href="assets/github-logo.png"
      type="image/x-icon"
    />

    <!-- daisy ui initialized -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />

    <!-- Icon font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="flex justify-center items-center h-screen bg-base-200">
      <div class="card w-96 bg-base-100 shadow-xl">
        <div class="card-body">
          <div class="text-center">
            <img class="w-20 mx-auto" src="assets/github-logo.png" alt="" />
            <h2 class="text-xl font-bold mt-4">Github Issues Tracker</h2>
            <p class="text-sm text-gray-500">Sign in to manage your issues</p>
          </div>
        </div>

        <form action="" class="mt-2 px-8">
          <label for="username" class="label">
            <span class="text-gray-600 text-lg font-semibold">Username</span>
          </label>
          <input
            type="text"
            id="username"
            class="input input-bordered w-full"
            name=""
          />
          <span class="text-sm text-indigo-500">default:admin</span><br />

          <label for="password" class="label mt-3">
            <span class="text-gray-600 text-lg font-semibold">Password</span>
          </label>
          <input
            type="password"
            id="password"
            class="input input-bordered w-full"
            name=""
          />
          <span class="text-sm text-indigo-500">default:admin123</span>

          <button id="login-btn" class="btn btn-primary w-full mt-4">Sign In</button>
          
        </form>

        <div class="flex items-center gap-4 mt-6 px-8">
          <div class="flex-1 h-px bg-gray-300"></div>
          <div class="text-gray-500 text-sm">Or</div>
          <div class="flex-1 h-px bg-gray-300"></div>
        </div>

        <div class="flex justify-center">
          <p>Demo Credentials:</p>
        </div>
        <div class="card flex items-center bg-gray-200 mt-1 mx-8 p-2 mb-8">
          <span class="text-sm font-semibold">Username: admin</span>
          <span class="text-sm font-semibold">Password: admin123</span>
        </div>
      </div>
    </div>
         
    <script src="login.js"></script>
     
  </body>
</html>
